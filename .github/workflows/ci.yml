name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Run Gherkin AI Spec Validation
        run: npx -y gherkin-ai@2.0.0-beta.1 validate

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/ShippingPlatform.sln

      - name: Build Backend Solution
        run: dotnet build backend/ShippingPlatform.sln --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test tests/Shipping.UnitTests/Shipping.UnitTests.csproj --no-build --verbosity normal
