name: CI & Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Gherkin AI Architectural Linter
        run: pnpm ghk:validate

      - name: Restore & Build .NET Solution
        run: dotnet build backend/ShippingPlatform.sln -c Release

      - name: Run .NET Unit, Architecture & Integration Tests
        run: dotnet test backend/ShippingPlatform.sln -c Release --no-build

      - name: Build Stand-Alone Angular Frontend
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm --filter e2e-tests exec playwright install chromium --with-deps

      - name: Run Playwright E2E Tests
        run: pnpm e2e
